# Voltec — coturn (TURN/STUN) para as chamadas WebRTC.
# IP público, realm e segredo são passados pelo compose a partir do .env
# (--external-ip / --realm / --static-auth-secret). Aqui fica a base estática.

listening-port=3478
# tls-listening-port=5349        # habilite com certificado para TURN sobre TLS (443/5349)

# Autenticação por usuário/senha de longo prazo (usuário vem via --user no compose).
# Mais simples para uso interno. Para maior segurança, troque por credenciais
# efêmeras: use 'use-auth-secret' + '--static-auth-secret' e gere creds no servidor.
lt-cred-mech
fingerprint

# Faixa de portas de relay (UDP). LIBERE estas portas no firewall do servidor.
# Aumente o intervalo conforme o número de chamadas simultâneas.
min-port=49160
max-port=49200

# Segurança: não faça relay para redes privadas/loopback (anti-SSRF).
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# Logs enxutos para container.
simple-log
no-stdout-log
